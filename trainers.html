    <script>
        requestAnimationFrame(async () => {
            void renderAuthNav();
            const currentUser = await getCurrentUser();
            if (currentUser?.role === 'client') await refreshCachedClientSubscriptionStatus(currentUser.id);
            void loadTrainers();
        });

        (function () {
            const mobileBtn = document.getElementById('mobile-menu-btn');
            const mobileMenu = document.getElementById('mobile-menu');
            if (mobileBtn && mobileMenu) {
                mobileBtn.addEventListener('click', () => {
                    mobileMenu.classList.toggle('hidden');
                    const icon = mobileBtn.querySelector('span');
                    icon.textContent = mobileMenu.classList.contains('hidden') ? 'menu' : 'close';
                });
            }
        })();

        let allTrainers = [];
        let currentSort = 'rating';
        let showOnlyBlack = false;
        let trainerRealtimeSubscribed = false;
        let renderFrame = 0;
        let lastRenderKey = '';
        let lastRenderedEmpty = null;
        let lastFilterKey = '';
        let lastFilteredRef = null;
        let lastFilteredResult = null;
        let lastSortKey = '';
        let lastSortedResult = null;
        let trainersVersion = 0;

        function toggleLocationInput() {
            const mode = document.getElementById('search-mode').value;
            const locationInput = document.getElementById('search-location');
            locationInput.style.display = mode === 'offline' ? 'block' : 'none';
            if (mode === 'offline') {
                void prefillOfflineLocation();
            } else {
                locationInput.placeholder = 'Pincode or City';
            }
        }

        async function prefillOfflineLocation() {
            const locationInput = document.getElementById('search-location');
            if (!locationInput || locationInput.value.trim()) return;

            locationInput.placeholder = 'Detecting your city...';
            try {
                const resolved = await requestOfflineSearchLocation();
                if (document.getElementById('search-mode')?.value !== 'offline') return;
                if (resolved?.label && !locationInput.value.trim()) {
                    locationInput.value = resolved.label;
                }
            } catch {
                locationInput.placeholder = 'Enter your city';
                locationInput.focus();
            }
        }

        async function requestOfflineSearchLocation() {
            if (typeof window.resolveOfflineSearchLocation === 'function') {
                return window.resolveOfflineSearchLocation();
            }

            if (!navigator.geolocation) {
                throw new Error('Geolocation is not available in this browser.');
            }

            const position = await new Promise((resolve, reject) => {
                navigator.geolocation.getCurrentPosition(resolve, reject, {
                    enableHighAccuracy: true,
                    timeout: 6500,
                    maximumAge: 300000
                });
            });

            return {
                lat: position.coords.latitude,
                lng: position.coords.longitude,
                label: 'Your area'
            };
        }

// --- REALTIME UPDATES ---
function listenForTrainerUpdates() {
    if (trainerRealtimeSubscribed) return;
    trainerRealtimeSubscribed = true;

    supabase.channel('public-trainers-updates')
        .on('postgres_changes', { event: '*', schema: 'public', table: 'profiles' }, payload => {
            const row = payload.new || payload.old;
            if (!row || row.role !== 'trainer') return;

            const updatedTrainer = (typeof window.normalizeTrainerBadges === 'function')
                ? window.normalizeTrainerBadges(row)
                : row;

            const idx = allTrainers.findIndex(t => t.id === updatedTrainer.id);

            if (payload.eventType === 'DELETE') {
                if (idx !== -1) allTrainers.splice(idx, 1);
            } else if (idx !== -1) {
                allTrainers[idx] = { ...allTrainers[idx], ...updatedTrainer };
            } else if (payload.eventType === 'INSERT') {
                allTrainers.push(updatedTrainer);
            }

            // Re-apply all active filters (search, tags, black-only, sort)
            trainersVersion += 1;
            if (typeof applyAllFilters === 'function') applyAllFilters();
        })
        .subscribe();
}
// ------------------------


        function applyTrainerData(trainers) {
            // Default order now comes from the shared ranking comparator
            // inside getTrainers()/normalizeTrainerList() (auth.js) — no
            // need to re-sort here. The explicit "Sort by" dropdown below
            // (sortAndRender/currentSort) still applies on top when the
            // user picks a specific sort option.
            allTrainers = Array.isArray(trainers) ? [...trainers] : [];

            trainersVersion += 1;

            renderTrustStrip();
            applyAllFilters();
            listenForTrainerUpdates();
        }

        function renderTrustStrip() {
            const el = document.getElementById('trust-strip');
            if (!el) return;
            const total = allTrainers.length;
            if (!total) {
                el.classList.add('hidden');
                return;
            }
            const rated = allTrainers.filter(t => Number(t?.rating) > 0);
            const avg = rated.length ? (rated.reduce((sum, t) => sum + Number(t.rating), 0) / rated.length) : null;
            const parts = [`${total}+ verified trainers`];
            if (avg) parts.push(`${avg.toFixed(1)}★ average rating`);
            parts.push('Pan-India');
            el.textContent = parts.join(' · ');
            el.classList.remove('hidden');
        }

        async function loadTrainers() {
            document.getElementById('loading').classList.remove('hidden');
            document.getElementById('empty-state').classList.add('hidden');

            try {
                // Prefer auth.js helper (caching + consistent shape)
                if (typeof getTrainers === 'function') {
                    const initialTrainers = await getTrainers({
                        onUpdate: (freshTrainers) => {
                            applyTrainerData(freshTrainers);
                        }
                    });

                    if (Array.isArray(initialTrainers) && initialTrainers.length > 0) {
                        applyTrainerData(initialTrainers);
                    }

                    return;
                }

                // Fallback direct DB fetch (legacy). Must mirror the same
                // discoverability rule as getTrainers()/searchTrainers() in
                // auth.js: only onboarded, actively subscribed (checked via
                // subscription_expires_at, not the lazily-synced
                // subscription_status -- see applyDiscoverabilityFilter() in
                // auth.js), admin-verified, active-account trainers are shown.
                const { data, error } = await supabase
                    .from('profiles')
                    .select('id, name, avatar_url, rating, review_count, location, city, state, training_mode, specialty, bio, plans, tags')
                    .eq('role', 'trainer')
                    .eq('onboarding_completed', true)
                    .gt('subscription_expires_at', new Date().toISOString())
                    .eq('verification_status', 'verified')
                    .eq('account_status', 'active')
                    .order('rating', { ascending: false })
                    .limit(200);

                if (error) throw error;
                applyTrainerData(data || []);
            } catch (error) {
                console.error('Error loading trainers:', error);
                allTrainers = [];
                renderTrainers([]);
            }
        }

        function getHourlyPrice(t) {
            const raw = t?.plans?.hourly?.price;
            const n = typeof raw === 'string' ? Number(raw) : raw;
            return Number.isFinite(n) && n > 0 ? n : null;
        }

function buildRenderKey(trainers) {
            if (!Array.isArray(trainers) || trainers.length === 0) return 'empty';
            let hash = 0;
            for (let i = 0; i < trainers.length; i += 1) {
                const id = String(trainers[i]?.id || '');
                for (let j = 0; j < id.length; j += 1) {
                    hash = (hash * 31 + id.charCodeAt(j)) >>> 0;
                }
            }
            return `${trainers.length}:${hash}`;
        }

        function renderTrainers(trainers) {
            const grid = document.getElementById('trainers-grid');
            const loading = document.getElementById('loading');
            const emptyState = document.getElementById('empty-state');
            const count = document.getElementById('trainer-count');

            const renderKey = `${trainersVersion}:${buildRenderKey(trainers)}`;
            const isEmpty = !trainers || trainers.length === 0;
            if (renderKey === lastRenderKey && lastRenderedEmpty === isEmpty) {
                return;
            }
            lastRenderKey = renderKey;
            lastRenderedEmpty = isEmpty;

            loading.classList.add('hidden');

            if (!trainers || trainers.length === 0) {
                grid.innerHTML = '';
                renderEmptyStateMessage();
                emptyState.classList.remove('hidden');
                count.textContent = '0';
                return;
            }

            emptyState.classList.add('hidden');
            count.textContent = trainers.length;

            if (typeof window.renderPremiumTrainerCardHTML !== 'function') {
                console.error('renderPremiumTrainerCardHTML is not available. Ensure auth.js is loaded.');
                grid.innerHTML = '';
                emptyState.classList.remove('hidden');
                count.textContent = '0';
                return;
            }

            if (renderFrame) cancelAnimationFrame(renderFrame);
            renderFrame = requestAnimationFrame(() => {
                grid.innerHTML = trainers.map(tRaw => window.renderPremiumTrainerCardHTML(tRaw, { context: 'public' })).join('');
                renderFrame = 0;
            });
        }

        function parsePriceBand(value) {
            if (!value || value === 'any') return null;
            const [min, max] = value.split('-').map(Number);
            return { min, max };
        }

        function renderEmptyStateMessage() {
            const title = document.getElementById('empty-state-title');
            const subtitle = document.getElementById('empty-state-subtitle');
            if (!title || !subtitle) return;

            const query = (document.getElementById('search-query')?.value || '').trim();

            if (!allTrainers.length) {
                title.textContent = 'No trainers yet';
                subtitle.textContent = "We're onboarding trainers in your area — check back soon.";
            } else if (query) {
                title.textContent = `No trainers match "${query}"`;
                subtitle.textContent = 'Try a different goal or clear your search.';
            } else if (showOnlyBlack) {
                title.textContent = 'No Onlifit Black trainers right now';
                subtitle.textContent = "We're curating our premium lineup — check back shortly.";
            } else {
                title.textContent = 'No trainers found';
                subtitle.textContent = 'Try adjusting your search or filters';
            }
        }

        function applyAllFilters() {
            const query = (document.getElementById('search-query')?.value || '').trim().toLowerCase();
            const mode = document.getElementById('search-mode')?.value || 'online';
            const location = mode === 'offline' ? (document.getElementById('search-location')?.value || '').trim().toLowerCase() : '';
            const priceBand = document.getElementById('price-filter')?.value || 'any';
            const minRating = Number(document.getElementById('rating-filter')?.value || 0);

            const filterKey = [
                trainersVersion,
                query,
                mode,
                location,
                priceBand,
                minRating,
                currentSort,
                showOnlyBlack ? 'black' : 'all'
            ].join('|');

            if (allTrainers === lastFilteredRef && filterKey === lastFilterKey && Array.isArray(lastFilteredResult)) {
                sortAndRender(lastFilteredResult);
                return;
            }

            let filtered = Array.isArray(allTrainers) ? [...allTrainers] : [];

            if (query) {
                filtered = filtered.filter(t =>
                    (t?.name || '').toLowerCase().includes(query) ||
                    (t?.specialty || '').toLowerCase().includes(query) ||
                    (t?.bio || '').toLowerCase().includes(query) ||
                    (Array.isArray(t?.tags) ? t.tags.some(tag => String(tag || '').toLowerCase().includes(query)) : false)
                );
            }

            if (location) {
                filtered = filtered.filter(t =>
                    (t?.location || '').toLowerCase().includes(location) ||
                    (t?.city || '').toLowerCase().includes(location) ||
                    (t?.state || '').toLowerCase().includes(location)
                );
            }

            const band = parsePriceBand(priceBand);
            if (band) {
                filtered = filtered.filter(t => {
                    const price = getHourlyPrice(t);
                    return price !== null && price >= band.min && price <= band.max;
                });
            }

            if (minRating > 0) {
                filtered = filtered.filter(t => Number(t?.rating) >= minRating);
            }

            if (showOnlyBlack) {
                filtered = filtered.filter(t => {
                    const normalized = (typeof window.normalizeTrainerBadges === 'function') ? window.normalizeTrainerBadges(t) : t;
                    return !!normalized?.hasBlackStatus;
                });
            }

            lastFilteredRef = allTrainers;
            lastFilterKey = filterKey;
            lastFilteredResult = filtered;
            sortAndRender(filtered);
        }

        function filterByGoal(goal) {
            const input = document.getElementById('search-query');
            if (input) input.value = goal === 'all' ? '' : goal;

            document.querySelectorAll('.goal-chip').forEach(btn => {
                const active = btn.dataset.goal === goal;
                btn.classList.toggle('active', active);
                btn.classList.toggle('bg-primary', active);
                btn.classList.toggle('text-on-primary', active);
                btn.classList.toggle('border-primary', active);
                btn.classList.toggle('border-outline', !active);
                btn.classList.toggle('text-on-surface-variant', !active);
                btn.setAttribute('aria-pressed', String(active));
            });

            applyAllFilters();
        }

        function toggleBlackOnly() {
            showOnlyBlack = !showOnlyBlack;
            const btn = document.getElementById('black-only-toggle');
            if (btn) {
                btn.setAttribute('aria-pressed', String(showOnlyBlack));
                btn.classList.toggle('bg-on-surface', showOnlyBlack);
                btn.classList.toggle('text-white', showOnlyBlack);
            }
            applyAllFilters();
        }

        function sortTrainers() {
            currentSort = document.getElementById('sort-by').value;
            applyAllFilters();
        }

        function parseExperienceYears(experience) {
            const match = String(experience || '').match(/\d+(\.\d+)?/);
            return match ? parseFloat(match[0]) : 0;
        }

        function sortAndRender(trainers) {
            const sortKey = `${trainersVersion}|${currentSort}|${buildRenderKey(trainers)}`;
            if (sortKey === lastSortKey && Array.isArray(lastSortedResult)) {
                renderTrainers(lastSortedResult);
                return;
            }

            let sorted = [...(trainers || [])];

            switch(currentSort) {
                case 'rating':
                    sorted.sort((a, b) => (Number(b.rating) || 0) - (Number(a.rating) || 0));
                    break;
                case 'price-low':
                    sorted.sort((a, b) => {
                        const pa = getHourlyPrice(a);
                        const pb = getHourlyPrice(b);
                        return (pa ?? Number.POSITIVE_INFINITY) - (pb ?? Number.POSITIVE_INFINITY);
                    });
                    break;
                case 'price-high':
                    sorted.sort((a, b) => {
                        const pa = getHourlyPrice(a);
                        const pb = getHourlyPrice(b);
                        return (pb ?? Number.NEGATIVE_INFINITY) - (pa ?? Number.POSITIVE_INFINITY);
                    });
                    break;
                case 'experience':
                    sorted.sort((a, b) => parseExperienceYears(b.experience) - parseExperienceYears(a.experience));
                    break;
            }

            lastSortKey = sortKey;
            lastSortedResult = sorted;
            renderTrainers(sorted);
        }

        async function performSearch() {
            const mode = document.getElementById('search-mode')?.value || 'online';
            const locationInput = document.getElementById('search-location');
            if (mode === 'offline' && locationInput && !locationInput.value.trim()) {
                try {
                    const resolved = await requestOfflineSearchLocation();
                    if (resolved?.label) {
                        locationInput.value = resolved.label;
                    } else {
                        locationInput.focus();
                        return;
                    }
                } catch {
                    locationInput.focus();
                    return;
                }
            }
            applyAllFilters();
        }

        function resetFilters() {
            document.getElementById('search-query').value = '';
            document.getElementById('search-mode').value = 'online';
            document.getElementById('search-location').style.display = 'none';
            document.getElementById('price-filter').value = 'any';
            document.getElementById('rating-filter').value = '0';
            currentSort = 'rating';
            document.getElementById('sort-by').value = 'rating';
            showOnlyBlack = false;

            const blackToggle = document.getElementById('black-only-toggle');
            if (blackToggle) {
                blackToggle.setAttribute('aria-pressed', 'false');
                blackToggle.classList.remove('bg-on-surface', 'text-white');
            }

            document.querySelectorAll('.goal-chip').forEach(btn => {
                const active = btn.dataset.goal === 'all';
                btn.classList.toggle('active', active);
                btn.classList.toggle('bg-primary', active);
                btn.classList.toggle('text-on-primary', active);
                btn.classList.toggle('border-primary', active);
                btn.classList.toggle('border-outline', !active);
                btn.classList.toggle('text-on-surface-variant', !active);
                btn.setAttribute('aria-pressed', String(active));
            });

            applyAllFilters();
        }

    </script>
<script src="footer-component.js"></script></body>
