    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="mobile-optimizations.css" rel="stylesheet" />

        html { font-size: 16px; }
        body { font-size: 1rem; line-height: 1.5; }

        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .glass-effect {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }
    </style>

<body class="bg-background text-on-background font-body">
    <!-- Navigation -->
    <nav class="fixed top-0 w-full z-50 glass-effect border-b border-outline-variant/30">
        <div class="flex items-center justify-between px-6 md:px-8 py-4 max-w-screen-2xl mx-auto">
            <div class="flex items-center gap-8 min-w-0">
                <a href="onlifit.html" class="text-2xl font-black tracking-tighter text-primary font-headline font-semibold shrink-0">Onlifit</a>
                <div class="hidden md:flex gap-6 items-center">
                    <a href="pricing.html" class="text-sm font-bold text-on-surface-variant hover:text-primary transition-colors">Pricing</a>
                    <a href="join-us.html" class="text-sm font-bold text-on-surface-variant hover:text-primary transition-colors">Join Us</a>
                    <a href="gym-landing.html" class="text-sm font-bold text-on-surface-variant hover:text-primary transition-colors">For Gyms</a>
                </div>
            </div>
            <div class="flex items-center gap-2">
                <div id="nav-auth" class="flex items-center"></div>
                <!-- Mobile Menu Button -->
                <button id="mobile-menu-btn" class="md:hidden p-2 text-on-surface hover:bg-surface-container rounded-full transition-colors" aria-label="Open menu">
                    <span class="material-symbols-outlined text-2xl">menu</span>
                </button>
            </div>
        </div>

        <!-- Mobile Dropdown Menu -->
        <div id="mobile-menu" class="hidden md:hidden bg-surface border-b border-outline-variant/30 px-6 py-4 flex flex-col gap-4 shadow-xl absolute w-full left-0 top-full">
            <a href="pricing.html" class="text-base font-bold text-on-surface hover:text-primary py-2 border-b border-outline-variant/30">Pricing</a>
            <a href="join-us.html" class="text-base font-bold text-on-surface hover:text-primary py-2 border-b border-outline-variant/30">Join Us</a>
            <a href="gym-landing.html" class="text-base font-bold text-on-surface hover:text-primary py-2">For Gyms</a>
        </div>
    </nav>

    <main class="pt-28 pb-20 px-6">
        <div class="max-w-3xl mx-auto">
            <a href="gym-jobs.html" class="inline-flex items-center gap-1 text-sm font-bold text-on-surface-variant hover:text-primary transition-colors mb-6">
                <span class="material-symbols-outlined text-[18px]">arrow_back</span> Back to Jobs
            </a>

            <!-- Loading skeleton -->
            <div id="loading" class="bg-white border border-outline-variant/30 rounded-2xl p-8 animate-pulse">
                <div class="h-6 bg-surface-container-low rounded w-1/2 mb-4"></div>
                <div class="h-4 bg-surface-container-low rounded w-1/3 mb-6"></div>
                <div class="h-3 bg-surface-container-low rounded w-full mb-2"></div>
                <div class="h-3 bg-surface-container-low rounded w-5/6"></div>
            </div>

            <!-- Not found / expired state -->
            <div id="not-found-state" class="hidden bg-white border border-outline-variant/30 rounded-2xl p-10 text-center">
                <span class="material-symbols-outlined text-6xl text-on-surface-variant mb-4" aria-hidden="true">work_off</span>
                <p class="text-on-surface font-bold text-xl mb-2">This job post is no longer active</p>
                <p class="text-on-surface-variant mb-6">It may have expired or been removed by the gym.</p>
                <a href="gym-jobs.html" class="inline-block px-6 py-3 bg-primary text-on-primary rounded-full font-bold hover:opacity-90 transition-all">Browse Other Jobs</a>
            </div>

            <!-- Job detail card -->
            <div id="job-detail" class="hidden bg-white border border-outline-variant/30 rounded-2xl p-8 shadow-sm">
                <h1 id="job-gym-name" class="font-headline text-2xl md:text-3xl font-black text-on-surface mb-2"></h1>
                <p id="job-location" class="text-sm text-on-surface-variant flex items-center gap-1 mb-4">
                    <span class="material-symbols-outlined text-[18px]">location_on</span>
                    <span></span>
                </p>

                <div class="flex flex-wrap gap-2 mb-6">
                    <span id="job-speciality-badge" class="inline-flex items-center rounded-full bg-primary/10 text-primary text-sm font-bold px-4 py-1.5"></span>
                    <span id="job-employment-badge" class="inline-flex items-center rounded-full bg-surface-container-low text-on-surface-variant text-sm font-bold px-4 py-1.5"></span>
                    <span id="job-experience-badge" class="inline-flex items-center rounded-full bg-surface-container-low text-on-surface-variant text-sm font-bold px-4 py-1.5"></span>
                </div>

                <div id="job-description-wrap" class="mb-6">
                    <h3 class="font-headline text-sm font-bold text-on-surface uppercase tracking-wider mb-2">About This Role</h3>
                    <p id="job-description" class="text-on-surface-variant text-sm leading-relaxed"></p>
                </div>

                <p id="job-posted-date" class="text-xs text-on-surface-variant/70 mb-8"></p>

                <a id="job-whatsapp-btn" href="#" target="_blank" class="w-full flex items-center justify-center gap-2 py-4 bg-primary text-on-primary rounded-xl font-bold text-lg shadow-lg shadow-primary/20 hover:opacity-90 transition-all">
                    <span class="material-symbols-outlined">chat</span> Contact on WhatsApp
                </a>
            </div>
        </div>
    </main>

    <!-- Supabase and Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-client.js"></script>
    <script src="auth.js"></script>
    <script>
        function employmentTypeLabel(type) {
            if (type === 'full_time') return 'Full Time';
            if (type === 'part_time') return 'Part Time';
            if (type === 'both') return 'Full Time / Part Time';
            return type || '';
        }

        function formatPostedDate(iso) {
            if (!iso) return '';
            try {
                return 'Posted on ' + new Date(iso).toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' });
            } catch { return ''; }
        }

        function showNotFound() {
            document.getElementById('loading').classList.add('hidden');
            document.getElementById('job-detail').classList.add('hidden');
            document.getElementById('not-found-state').classList.remove('hidden');
        }

        async function loadJobDetail() {
            const params = new URLSearchParams(window.location.search);
            const jobId = params.get('id');

            if (!jobId) {
                showNotFound();
                return;
            }

            try {
                const { data: job, error } = await supabaseClient
                    .from('gym_hiring_posts')
                    .select('id, speciality, experience_level, location, employment_type, gym_whatsapp, description, posted_at, status, expires_at, gym_profiles(gym_name)')
                    .eq('id', jobId)
                    .maybeSingle();

                if (error || !job) {
                    showNotFound();
                    return;
                }

                const isActive = job.status === 'active' && job.expires_at && new Date(job.expires_at) > new Date();
                if (!isActive) {
                    showNotFound();
                    return;
                }

                const gymName = job.gym_profiles?.gym_name || 'A gym in Hyderabad';

                document.getElementById('job-gym-name').textContent = gymName;
                document.getElementById('job-location').querySelector('span').textContent = job.location;
                document.getElementById('job-speciality-badge').textContent = job.speciality;
                document.getElementById('job-employment-badge').textContent = employmentTypeLabel(job.employment_type);
                document.getElementById('job-experience-badge').textContent = job.experience_level + ' experience';
                document.getElementById('job-posted-date').textContent = formatPostedDate(job.posted_at);

                const descWrap = document.getElementById('job-description-wrap');
                if (job.description) {
                    document.getElementById('job-description').textContent = job.description;
                } else {
                    descWrap.classList.add('hidden');
                }

                const message = `Hi, I found your hiring post on Onlifit. I'm interested in the ${job.speciality} position at ${gymName}. Can we connect?`;
                const whatsappNumber = String(job.gym_whatsapp || '').replace(/\D/g, '');
                document.getElementById('job-whatsapp-btn').href = `https://wa.me/91${whatsappNumber}?text=${encodeURIComponent(message)}`;

                document.getElementById('loading').classList.add('hidden');
                document.getElementById('job-detail').classList.remove('hidden');
            } catch (e) {
                console.error('Failed to load job detail:', e);
                showNotFound();
            }
        }

        requestAnimationFrame(() => {
            void renderAuthNav();
            void loadJobDetail();
        });

        (function () {
            const mobileBtn = document.getElementById('mobile-menu-btn');
            const mobileMenu = document.getElementById('mobile-menu');
            mobileBtn?.addEventListener('click', () => {
                mobileMenu?.classList.toggle('hidden');
            });
        })();
    </script>
    <script src="footer-component.js"></script>
</body>
</html>
