<!DOCTYPE html>
<html class="scroll-smooth" lang="en">
<head>
    <script>
        document.write('<base href="' + (window.location.protocol === 'file:' ? './' : '/') + '">');
    </script>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Gym Sign Up | Onlifit</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;900&family=Inter:wght@400;600;700&display=swap" rel="stylesheet"/>

    <link href="styles.css" rel="stylesheet" />
    <link href="mobile-optimizations.css" rel="stylesheet" />

    <style>
        body {
            font-family: Inter, sans-serif;
            color: #000000;
            background: linear-gradient(180deg, #fafafa 0%, #f5f5f5 100%);
            min-height: 100vh;
            margin: 0;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        .auth-shell {
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 1.5rem;
        }

        .auth-card {
            width: min(100%, 32rem);
            border: 1px solid #e8e8e8;
            border-radius: 2rem;
            background: #ffffff;
            box-shadow: 0 16px 42px rgba(0, 0, 0, 0.08);
            padding: 2.5rem 2rem;
        }

        .auth-heading {
            font-family: Poppins, sans-serif;
            font-weight: 700;
            font-size: 1.5rem;
            color: #000000;
            margin: 1rem 0 0.5rem 0;
        }

        .auth-subtitle {
            font-size: 0.875rem;
            color: #666666;
            margin: 0.5rem 0 1.5rem 0;
        }

        .auth-input {
            width: 100%;
            border: 1px solid #e8e8e8;
            border-radius: 0.75rem;
            padding: 0.75rem 0.875rem;
            min-height: 48px;
            background: #ffffff;
            font-size: 0.95rem;
            color: #000000;
            font-family: Inter, sans-serif;
            outline: none;
            transition: border-color 0.2s ease;
            -webkit-appearance: none;
            -moz-appearance: none;
            appearance: none;
        }

        @media (max-width: 480px) {
            .auth-input { font-size: 16px; min-height: 48px; }
        }

        .auth-input::placeholder { color: #999999; }
        .auth-input:focus { border-color: #000000; }

        select.auth-input {
            cursor: pointer;
        }

        .auth-label {
            display: block;
            font-size: 0.8rem;
            font-weight: 600;
            color: #333333;
            margin-bottom: 0.35rem;
        }

        .auth-field {
            margin-bottom: 1rem;
        }

        .auth-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }

        .primary-btn {
            width: 100%;
            border: 0;
            border-radius: 0.75rem;
            padding: 0.75rem 1rem;
            min-height: 48px;
            font-size: 0.95rem;
            font-weight: 700;
            color: #ffffff;
            background: #000000;
            transition: background 0.2s ease;
            cursor: pointer;
            font-family: Inter, sans-serif;
            -webkit-appearance: none;
            -moz-appearance: none;
            appearance: none;
        }

        @media (max-width: 480px) {
            .primary-btn { font-size: 16px; min-height: 48px; }
        }

        .primary-btn:hover { background: #1a1a1a; }
        .primary-btn:active { background: #000000; }
        .primary-btn:disabled { opacity: 0.6; cursor: not-allowed; }

        .notice {
            border-radius: 0.75rem;
            border: 1px solid transparent;
            padding: 0.75rem 0.9rem;
            font-size: 0.85rem;
            line-height: 1.4;
            margin-bottom: 1rem;
        }

        .notice.error {
            background: #fff5f5;
            border-color: #ffcccc;
            color: #cc0000;
        }

        .notice.success {
            background: #f0f9ff;
            border-color: #b3e5fc;
            color: #0066cc;
        }
    </style>
<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-4W2306MJ1Y"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'G-4W2306MJ1Y');
</script>
</head>
<body>
    <main class="auth-shell">
        <section class="auth-card">
            <a href="onlifit.html" class="text-2xl font-black tracking-tighter text-primary font-headline font-semibold">Onlifit</a>
            <h1 class="auth-heading">Set Up Your Gym Account</h1>
            <p class="auth-subtitle">Post hiring requirements and reach verified trainers across Hyderabad.</p>

            <div id="gym-signup-notice" class="hidden"></div>

            <form id="gym-signup-form">
                <div class="auth-field">
                    <label class="auth-label" for="gym-name">Gym Name</label>
                    <input id="gym-name" class="auth-input" type="text" required placeholder="e.g. FitZone Gym" />
                </div>

                <div class="auth-field">
                    <label class="auth-label" for="owner-name">Owner Name</label>
                    <input id="owner-name" class="auth-input" type="text" required placeholder="Your full name" />
                </div>

                <div class="auth-row">
                    <div class="auth-field">
                        <label class="auth-label" for="gym-city">City</label>
                        <select id="gym-city" class="auth-input" required>
                            <option value="Hyderabad">Hyderabad</option>
                        </select>
                    </div>
                    <div class="auth-field">
                        <label class="auth-label" for="gym-locations">Number of Locations</label>
                        <input id="gym-locations" class="auth-input" type="number" min="1" value="1" />
                    </div>
                </div>

                <div class="auth-field">
                    <label class="auth-label" for="gym-phone">Phone</label>
                    <input id="gym-phone" class="auth-input" type="tel" placeholder="10-digit number" />
                </div>

                <div class="auth-field">
                    <label class="auth-label" for="gym-email">Email</label>
                    <input id="gym-email" class="auth-input" type="email" required autocomplete="email" placeholder="Email address" />
                </div>

                <div class="auth-field">
                    <label class="auth-label" for="gym-password">Password</label>
                    <input id="gym-password" class="auth-input" type="password" required minlength="6" autocomplete="new-password" placeholder="At least 6 characters" />
                </div>

                <button id="gym-signup-submit" class="primary-btn" type="submit">Create Gym Account</button>
            </form>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-client.js"></script>
    <script src="auth.js"></script>
    <script>
        function setNotice(message, type) {
            const notice = document.getElementById('gym-signup-notice');
            if (!message) {
                notice.className = 'hidden';
                notice.textContent = '';
                return;
            }
            notice.className = `notice ${type === 'success' ? 'success' : 'error'}`;
            notice.textContent = message;
        }

        document.getElementById('gym-signup-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const submitBtn = document.getElementById('gym-signup-submit');

            const gymName = document.getElementById('gym-name').value.trim();
            const ownerName = document.getElementById('owner-name').value.trim();
            const city = document.getElementById('gym-city').value;
            const numberOfLocations = Number(document.getElementById('gym-locations').value) || 1;
            const phone = document.getElementById('gym-phone').value.trim();
            const email = document.getElementById('gym-email').value.trim().toLowerCase();
            const password = document.getElementById('gym-password').value;

            if (!gymName || !ownerName || !email || !password) {
                setNotice('Please fill in gym name, owner name, email, and password.', 'error');
                return;
            }
            if (password.length < 6) {
                setNotice('Password must be at least 6 characters long.', 'error');
                return;
            }

            setNotice('', 'error');
            submitBtn.disabled = true;
            submitBtn.textContent = 'Creating account...';

            try {
                const res = await fetch('/api/create-gym-signup', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ gymName, ownerName, city, numberOfLocations, phone, email, password })
                });
                const data = await res.json();

                if (!res.ok) {
                    setNotice(data.error || 'Could not create your account. Please try again.', 'error');
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Create Gym Account';
                    return;
                }

                setNotice('Account created! Signing you in...', 'success');

                const { error: loginError } = await supabaseClient.auth.signInWithPassword({ email, password });
                if (loginError) {
                    setNotice('Account created, but automatic sign-in failed. Please sign in manually.', 'error');
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Create Gym Account';
                    return;
                }

                window.location.href = 'gym-dashboard.html';
            } catch (err) {
                setNotice('Something went wrong. Please try again.', 'error');
                submitBtn.disabled = false;
                submitBtn.textContent = 'Create Gym Account';
            }
        });
    </script>
    <script src="footer-component.js"></script>
</body>
</html>
